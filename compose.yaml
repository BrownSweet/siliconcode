services:
  siliconcode:
    build: .
    image: siliconcode:local
    init: true
    restart: unless-stopped
    ports:
      - "${SILICONCODE_BIND_ADDRESS:-127.0.0.1}:${SILICONCODE_HTTP_PORT:-3100}:3100"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONCODE_DASHBOARD_TOKEN: ${SILICONCODE_DASHBOARD_TOKEN:-}
    volumes:
      - ${SILICONCODE_PROJECT_DIR:-.}:/workspace/project
      - siliconcode-state:/home/node/.siliconcode
      - siliconcode-worktrees:/workspace/.siliconcode-worktrees
      - siliconcode-node-modules:/workspace/project/node_modules
    stop_grace_period: 15s

volumes:
  siliconcode-state:
  siliconcode-worktrees:
  siliconcode-node-modules:
